server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 11ty writes /note/index.html -> serve clean URLs, else 404 page
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # same behaviour as vercel.json: everything unknown -> /404
    error_page 404 /404/index.html;

    # hashed/immutable assets
    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml application/rss+xml;

    # behind nginx-proxy-manager, so no TLS here
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
