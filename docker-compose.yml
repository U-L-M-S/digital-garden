services:
  digital-garden:
    build: .
    image: digital-garden:local
    container_name: digital-garden
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
